<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <title>𖦏 opel | Lab</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #0a0a0a;
      --text: #f5f5f5;
      --muted: #a2a8b0;
      --border: #282d34;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--background);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid #b1d3ff; outline-offset: 4px; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgb(10 10 10 / 96%);
      border-bottom: 1px solid #1b1b1b;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .header-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      max-width: 1480px;
      height: 72px;
      padding: 0 clamp(16px, 2vw, 28px);
      margin: auto;
    }
    .brand {
      justify-self: start;
      font-size: 25px;
      font-weight: 650;
      letter-spacing: -0.05em;
      white-space: nowrap;
    }
    .navigation { display: flex; gap: 7px; align-items: center; }
    .navigation a {
      padding: 9px 14px;
      border-radius: 9px;
      color: #b6b6b6;
      font-size: 13px;
      font-weight: 500;
      transition: background .2s, color .2s;
    }
    .navigation a:hover { color: #fff; background: #1b1b1b; }
    .site-link {
      justify-self: end;
      padding: 9px 16px;
      border: 1px solid #4c4c4c;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 550;
      white-space: nowrap;
      transition: border-color .2s, background .2s;
    }
    .site-link:hover { border-color: #b9b9b9; background: #161616; }

    main { padding: 8px 8px 0; }
    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: min(730px, calc(100svh - 88px));
      max-width: 1480px;
      margin: 0 auto;
      padding: 100px 24px;
      overflow: hidden;
      border-radius: 16px;
      text-align: center;
      background-color: #050e1e;
      background-image:
        radial-gradient(ellipse 24% 12% at 50% 108%, #a7c8e8 0%, #648db8 29%, rgb(55 102 156 / 52%) 57%, transparent 100%),
        radial-gradient(ellipse 53% 60% at 50% 112%, #24558e 0%, #15345e 35%, rgb(15 36 67 / 52%) 65%, transparent 100%);
      box-shadow: inset 0 2px 8px rgb(125 170 215 / 9%);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: radial-gradient(circle, rgb(225 236 255 / 42%) 0.8px, transparent 1.1px);
      background-size: 7px 9px;
      -webkit-mask-image: radial-gradient(ellipse 67% 90% at 50% 100%, #000 0%, rgb(0 0 0 / 50%) 52%, transparent 100%);
      mask-image: radial-gradient(ellipse 67% 90% at 50% 100%, #000 0%, rgb(0 0 0 / 50%) 52%, transparent 100%);
      opacity: .55;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(180deg, rgb(0 0 0 / 12%), transparent 45%, rgb(0 0 0 / 8%));
    }
    .hero-content { max-width: 850px; }
    .eyebrow {
      display: block;
      margin-bottom: 24px;
      color: #b3c3d8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(64px, 9vw, 108px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -.07em;
    }
    .hero p {
      margin: 23px auto 0;
      color: #d3dce8;
      font-size: clamp(16px, 1.7vw, 19px);
      line-height: 1.5;
      text-wrap: balance;
    }
    .hero-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 34px;
      padding: 13px 21px;
      border: 1px solid rgb(255 255 255 / 34%);
      border-radius: 999px;
      background: rgb(8 19 38 / 40%);
      font-weight: 550;
      transition: border-color .2s, background .2s, transform .2s;
    }
    .hero-button:hover { border-color: #fff; background: rgb(24 46 76 / 65%); transform: translateY(-2px); }

    .experiments {
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(75px, 9vw, 120px) clamp(15px, 3vw, 35px) 105px;
      scroll-margin-top: 72px;
    }
    .section-top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }
    .section-label {
      color: #96acc8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h2 {
      margin: 6px 0 0;
      font-size: clamp(30px, 4vw, 44px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -.045em;
    }
    .section-count { color: #777; font-size: 12px; }
    .empty-state {
      display: grid;
      place-items: center;
      min-height: 240px;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(145deg, #101723, #0c0e12 75%);
      color: #abb7c5;
      font-size: 14px;
      text-align: center;
    }

    .site-footer { border-top: 1px solid #202020; }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      max-width: 1200px;
      min-height: 90px;
      margin: 0 auto;
      padding: 18px 35px;
      color: #8b8b8b;
      font-size: 12px;
    }
    .footer-inner a:hover { color: white; }

    @media (max-width: 640px) {
      .header-inner { display: flex; justify-content: space-between; height: 60px; gap: 12px; padding: 0 12px; }
      .brand { font-size: 23px; }
      .navigation { display: none; }
      .site-link { padding: 7px 12px; }
      main { padding: 4px 4px 0; }
      .hero { min-height: 610px; padding: 80px 18px; border-radius: 12px; }
      .hero p { max-width: 290px; }
      .experiments { padding-bottom: 70px; }
      .footer-inner { padding: 18px 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .hero-button { transition: none; }
      .hero-button:hover { transform: none; }
    }

    body {
    isolation: isolate;
    }

    #floating-dots {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    }

    main,
    .site-footer {
    position: relative;
    z-index: 1;
    }

  </style>
</head>
<body>
<canvas id="floating-dots" aria-hidden="true"></canvas>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="opel Lab home">𖦏 opel</a>
      <nav class="navigation" aria-label="Main navigation">
        <a href="https://lab.opel.org.uk/experiments" target="_blank" rel="noopener noreferrer">Projects</a>
        <a href="https://github.com/xfwmk" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
      <a class="site-link" href="https://opel.org.uk">Main site ↗</a>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <h1 id="hero-title">lab.opel</h1>
        <p>Lab for web-app experiments</p>
        <a class="hero-button" href="#experiments">Explore experiments <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="experiments" id="experiments" aria-labelledby="experiments-title">
      <div class="section-top">
        <div>
          <h2 id="experiments-title">Experiments</h2>
        </div>
        <span class="section-count">0 published</span>
      </div>
      <div class="empty-state">projects will appear here</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>𖦏 opel | lab</span>
      <a href="https://opel.org.uk">opel.org.uk ↗</a>
    </div>
  </footer>

<script>
(() => {
  const canvas = document.getElementById("floating-dots");
  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const dotColor = "72, 72, 72";

  let dots = [];
  let width, height, lastTime, frame;

  function makeDot(scattered = false) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (5 + Math.random() * 10) * 0.5;
    const life = 8 + Math.random() * 10;

    return {
      x: Math.random() * width,
      y: Math.random() * height,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: 0.8 + Math.random() * 1.3,
      age: scattered ? Math.random() * life : 0,
      life
    };
  }

  function draw(dt) {
    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < dots.length; i++) {
      let dot = dots[i];

      dot.age += dt;
      if (dot.age >= dot.life) {
        dot = dots[i] = makeDot();
      }

      dot.x += dot.vx * dt;
      dot.y += dot.vy * dt;

      const fade = Math.min(
        1,
        dot.age / 2,
        (dot.life - dot.age) / 2
      );

      ctx.fillStyle = `rgba(${dotColor}, ${fade * 0.85})`;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function tick(now) {
    draw(Math.min((now - lastTime) / 1000, 0.05));
    lastTime = now;
    frame = requestAnimationFrame(tick);
  }

  function refresh() {
    cancelAnimationFrame(frame);
    draw(0);

    if (document.hidden || reducedMotion.matches) return;

    lastTime = performance.now();
    frame = requestAnimationFrame(tick);
  }

  function resize() {
    width = canvas.clientWidth;
    height = canvas.clientHeight;

    const scale = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);

    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    const count = Math.min(
      220,
      Math.ceil(width * height / 8000)
    );

    dots = Array.from(
      { length: count },
      () => makeDot(true)
    );

    refresh();
  }

  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", refresh);
  reducedMotion.addEventListener("change", refresh);

  resize();
})();
</script>

</body>
</html>
