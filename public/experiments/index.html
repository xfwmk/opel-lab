<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <title>𖦏 opel | Experiments</title>
  <link rel="stylesheet" href="/assets/lab.css">
  <script src="/assets/lab.js" defer></script>
</head>
<body data-page="experiments">
  <canvas id="floating-dots" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="opel Lab home">𖦏 opel</a>
      <nav class="navigation" aria-label="Main navigation">
        <a href="/experiments/" aria-current="page">Experiments</a>
        <a href="https://github.com/xfwmk" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
      <a class="site-link" href="https://opel.org.uk">Home</a>
    </div>
  </header>

  <main id="main-content">
    <section class="hero hero-directory" aria-labelledby="hero-title">
      <div class="hero-content">
        <h1 id="hero-title">Experiments</h1>
        <p>Projects I am currently working on</p>
      </div>
    </section>

    <section class="experiments experiments-directory" aria-labelledby="experiments-title">
      <div class="section-top">
        <div>
          <span class="section-label">Library</span>
          <h2 id="experiments-title">All experiments</h2>
        </div>
        <span class="section-count" data-experiment-count>0 published</span>
      </div>
      <div class="experiments-grid" data-experiment-list aria-live="polite">
        <div class="empty-state">Loading experiments…</div>
      </div>
    </section>
  </main>

</html>
